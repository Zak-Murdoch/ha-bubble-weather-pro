# Apple Weather style — every section enabled, tuned to look as close as
# possible to the iOS Weather app's full-screen forecast view.
type: custom:bubble-card
card_type: pop-up
modules:
  - bubble-weather-pro
entity: weather.home
name: Weather
weather_pro:
  moon_entity: sensor.moon_phase
  sun_entity: sun.sun
  show_hourly: true
  hourly_hours: 24
  show_daily: true
  daily_days: 10
  show_wind: true
  show_humidity: true
  show_rain_probability: true
  first_last_light: true
  animated_icons: true
  dynamic_background: true
  temperature_unit: auto
